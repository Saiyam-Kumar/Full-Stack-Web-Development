<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design a Card</title>
</head>

<!--Design a Card same as given in photo-->
<style>
    .card{
        height: 500px;
        width: 300px;
        border-radius: 15px;
        border: 2px solid grey;
        box-shadow: 2px 2px 2px 2px lightgrey;
    }
    .image{
        text-align: center;
        margin-top: 10px;
        margin-bottom: 20px;
    }
    .img{
        border-radius: 15px;
    }
    .box{
        padding: 4px;
        border: 2px solid lightgrey;
        border-radius: 20px;
        margin: 10px;
        color: gray;
    }
    .name{
        margin: 15px;
        
    }
    .text{
        margin-left: 15px;
        color: grey;
    }
    .read :hover{
        border: 2px solid lightblue;
        background-color: lightblue;
        border-radius: 20px;
        padding: 8px;
        color: rgb(62, 167, 203);
    }
    .more{
        text-align: center;
    }
</style>

<body>
    <div class="card">
        <div class="image">
            <img class = "img" src="img.jpg" alt="Lake Image" height="200px" width = "280px" >
        </div>
        <span class="box">
            <span>Nature</span>
        </span>
        <span class="box">
            <span>Lake</span>
        </span>
        <div class="name">
            <div><b><h1>Saiyam Stuti</h1></b></div>
        </div>
        <div class = "text">
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Excepturi non eligendi neque optio architecto libero inventore sit. Error accusantium impedit ipsam est quibusdam.</p>
        </div>
        <div class = "more">
            <span class = "read">
            <span >Read More</span>
        </span>
        </div>

    </div>
</body>
</html>
