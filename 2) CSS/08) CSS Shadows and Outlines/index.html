<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows and Outlines</title>
    <style>
        .box{
            padding: 45px;
            border: 5px solid black;
            box-shadow: 5px 5px 15px 5px #94313188;
        
        }
        .text{
            text-shadow: 2px 2px 4px #94313188;
        }
    </style>
</head>
<body>
    <div class="box">
        I am Box
    </div>
    <p class="text">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Exercitationem incidunt quam asperiores distinctio. Impedit officiis aliquam id quidem sint culpa suscipit, ducimus perspiciatis maiores quam. At optio nam natus quod!
    </p>
</body>
</html>
